# Deploy to production
#
# Builds and submits to the app stores, or sends an over-the-air update when there are no native changes.
# Learn more: https://docs.expo.dev/eas/workflows/examples/deploy-to-production/
#
# Created by EAS CLI v27.1.0

name: Deploy to production

on:
  push:
    branches: ['production']

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
  get_android_build:
    name: Check for existing android build
    needs:
      - fingerprint
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: production
  # get_ios_build:
  #   name: Check for existing ios build
  #   needs:
  #     - fingerprint
  #   type: get-build
  #   params:
  #     fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
  #     profile: production
  build_android:
    name: Build Android
    needs:
      - get_android_build
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: production
  # build_ios:
  #   name: Build iOS
  #   needs:
  #     - get_ios_build
  #   if: ${{ !needs.get_ios_build.outputs.build_id }}
  #   type: build
  #   params:
  #     platform: ios
  #     profile: production
  submit_android_build:
    name: Submit Android Build
    needs:
      - build_android
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
  # submit_ios_build:
  #   name: Submit iOS Build
  #   needs:
  #     - build_ios
  #   type: submit
  #   params:
  #     build_id: ${{ needs.build_ios.outputs.build_id }}
  publish_android_update:
    name: Publish Android update
    needs:
      - get_android_build
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    params:
      branch: production
      platform: android
  # publish_ios_update:
  #   name: Publish iOS update
  #   needs:
  #     - get_ios_build
  #   if: ${{ needs.get_ios_build.outputs.build_id }}
  #   type: update
  #   params:
  #     branch: production
  #     platform: ios
